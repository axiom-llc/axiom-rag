name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=rag --cov-report=xml --cov-report=term-missing
      - name: Generate pinned native RSI proposal (read-only)
        run: python -m rsi.native --output "$RUNNER_TEMP/rsi-candidates.json"
      - name: Independently benchmark native RSI candidate
        run: python -m rsi.benchmark --output "$RUNNER_TEMP/rsi-benchmark.json"
      - name: Retain native RSI candidate and benchmark receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-rsi-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/rsi-candidates.json
            ${{ runner.temp }}/rsi-benchmark.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
