[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-rag"
version = "1.5.0"
description = "RAG library and HTTP service — single-owner storage, bounded clients, retrieval evaluation"
authors = [{ name = "Axiom LLC", email = "axiom.co@proton.me" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "llm", "embeddings", "chromadb", "gemini"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-genai>=1.66.0",
    "chromadb==1.5.2",
    "flask>=3.0",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "cli:main"

[project.urls]
Releases = "https://github.com/axiom-llc/axiom-rag/releases"
Homepage = "https://axiom-llc.github.io"
Repository = "https://github.com/axiom-llc/axiom-rag"
Changelog = "https://github.com/axiom-llc/axiom-rag/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["rag*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
